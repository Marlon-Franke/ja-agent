# Haelt SHA-gepinnte Actions und die Python-Abhaengigkeiten aktuell
# (Revisionspruefung v0.4.4, P2.4). PRs laufen durch die CI; Matrix und
# Pruefsummenvergleich sichern Aktualisierungen ab.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # requirements*.txt fuehren bewusst Versionsspannen (z. B. openpyxl>=3.1,<4);
    # Minor-/Patch-Updates liegen bereits in der Spanne - Dependabot soll nur
    # neue Major-Versionen melden (Spanne/Obergrenze dann nach Matrixlauf
    # anheben), sonst entstehen PRs, die nur die Untergrenze anheben.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
