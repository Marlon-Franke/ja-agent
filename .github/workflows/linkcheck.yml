# Periodischer externer Linkcheck (Revisionspruefung v0.4.4, Befund P2.3):
# meldet gealterte externe Verweise (Gesetze, Claude-Code-/GitHub-Doku) -
# monatlich und manuell, blockiert keinen Pull Request. Relative Links sind
# Release-Gate (release_check.py). DATEV-Domains sind dokumentierte
# Ausnahmen (SPA antwortet immer 200; werkzeuge/pruefe_links_extern.py).
name: Linkcheck

on:
  schedule:
    - cron: "17 6 1 * *"   # monatlich, 1. Tag 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  extern:
    name: externe-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Externe Links pruefen (tolerant, mit Wiederholung)
        run: python werkzeuge/pruefe_links_extern.py --zeige-ok
