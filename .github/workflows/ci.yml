# CI-Release-Gates: automatisiert die Verifikationsschritte aus CLAUDE.md.
# Erwartungswerte (4 hoch / 30 mittel / 47 Hinweise; DQ-02 = 2 Hoch-
# Befunde; CO-02 = 1 Hinweis) folgen testdaten/erwartung.md - bei
# gewollten Katalogaenderungen dort UND hier nachziehen.
# Explizites `shell: bash` = `bash -eo pipefail`: sonst bestimmt bei
# `python ... | tee` der Exit-Code von tee den Schritt und ein Absturz
# der Pipeline nach der Summenzeile bliebe unentdeckt
# (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell).
# Laufprotokolle nach $RUNNER_TEMP, Zusatzlaeufe unter testdaten/ausgabe/
# (gitignored, von baue_dist ausgeschlossen) - kein Streugut im Repo.
name: CI

on:
  push:
    branches: [main]   # PR-Branches deckt pull_request ab (sonst Doppellauf)
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Python-Syntaxpruefung
        run: python -m compileall -q werkzeuge testdaten

      - name: Manifest-Validierung (Sollstruktur + JSON)
        run: |
          python - <<'PY'
          import json, pathlib, sys
          fehler = []
          for rel in (".claude-plugin/plugin.json",
                      ".claude-plugin/marketplace.json"):
              p = pathlib.Path(rel)
              if not p.is_file():
                  fehler.append(f"{rel} fehlt (Plugin-Spezifikation)")
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except json.JSONDecodeError as e:
                  fehler.append(f"{rel}: kein gueltiges JSON ({e})")
          for alt in (".claude-plugin/plugin", ".claude-plugin/marketplace"):
              if pathlib.Path(alt).exists():
                  fehler.append(f"{alt}: endungslose Manifestdatei")
          if fehler:
              print("\n".join(fehler), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Testdaten erzeugen
        run: python testdaten/erzeuge_testdaten.py

      - name: Standardlauf (GmbH) gegen Erwartungsbild
        run: |
          python werkzeuge/ja_pruefung.py --stapel testdaten \
            --susa testdaten/SuSa_2025_Demo.csv \
            --susa-vorjahr testdaten/SuSa_2024_Demo.csv \
            --opos testdaten/OPOS_2025_Demo.csv \
            --mandant "Demo GmbH" --rechtsform kapitalgesellschaft \
            --ausgabe testdaten/ausgabe 2>&1 | tee "$RUNNER_TEMP/standardlauf.txt"
          grep -F "Befunde: 4 hoch / 30 mittel / 47 Hinweise" "$RUNNER_TEMP/standardlauf.txt"
          if grep -F "WARNUNG: Bilanzprobe" "$RUNNER_TEMP/standardlauf.txt"; then
            echo "Bilanzprobe-Warnung darf nie auftreten" >&2; exit 1
          fi

      - name: Negativtest DQ-02 (falsche Rechtsform, 2 Hoch-Befunde)
        run: |
          python werkzeuge/ja_pruefung.py --stapel testdaten \
            --susa testdaten/SuSa_2025_Demo.csv \
            --susa-vorjahr testdaten/SuSa_2024_Demo.csv \
            --opos testdaten/OPOS_2025_Demo.csv \
            --mandant "Demo GmbH" --rechtsform personengesellschaft \
            --ausgabe testdaten/ausgabe/dq02 2>&1 | tee "$RUNNER_TEMP/dq02.txt"
          grep -E "hoch.*DQ-02 [^;]*\(2\)" "$RUNNER_TEMP/dq02.txt"

      - name: Zusatztest CO-02 (Folgejahresstapel, genau 1 Hinweis)
        run: |
          python werkzeuge/ja_pruefung.py --stapel testdaten \
            --stapel-folgejahr testdaten/folgejahr \
            --susa testdaten/SuSa_2025_Demo.csv \
            --susa-vorjahr testdaten/SuSa_2024_Demo.csv \
            --opos testdaten/OPOS_2025_Demo.csv \
            --mandant "Demo GmbH" --rechtsform kapitalgesellschaft \
            --ausgabe testdaten/ausgabe/co02 2>&1 | tee "$RUNNER_TEMP/co02.txt"
          grep -E "hinweis.*CO-02 [^;]*\(1\)" "$RUNNER_TEMP/co02.txt"

      - name: Distributionsbau inkl. Release-Validierung
        run: python werkzeuge/baue_dist.py
